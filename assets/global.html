<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkillMap — Global</title>
<script>try { const t = localStorage.getItem('skillmap-theme'); if (!document.documentElement.dataset.theme && (t === 'light' || t === 'dark')) document.documentElement.dataset.theme = t; } catch { /* storage blocked: follow the system */ }</script>
<style>
:root{
  color-scheme:dark; scrollbar-color:var(--line2) transparent;
  --bg:#0b0f17; --panel:#0f1522; --panel2:#151d2e; --line:#22304a; --line2:#2c3b57;
  --tx:#e6edf7; --tx2:#9fb0c9; --tx3:#66799a; --accent:#6366f1; --warn:#fbbf24;
  --c0:#818cf8; --c1:#38bdf8; --c2:#34d399; --c3:#fbbf24; --c4:#f472b6; --c5:#fb923c; --c6:#a3e635; --c7:#c084fc; --other:#4b5a78;
  --glow:#16203a; --bar:rgba(15,21,34,.8); --bar-f:rgba(15,21,34,.5); --nav:rgba(15,21,34,.45); --flowbar:rgba(15,21,34,.95); --tipbg:#0b1020;
  --wash:rgba(255,255,255,.02); --hov:#19243a; --link:#60a5fa; --spark:#5b6b8c; --cardtop:rgba(21,29,46,.55); --sqtx:#0b0f17;
  --b-ok:#34d399; --b-bad:#f87171; --b-warn:#fbbf24; --b-run:#38bdf8; --b-vio:#c084fc;
  --k-sessions:#34d399; --k-tokens:#38bdf8; --k-cost:#fbbf24; --k-time:#c084fc; --k-proj:#f472b6;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#f1f3f9; --line:#dfe4ef; --line2:#cbd2e2; --tx:#131a2c; --tx2:#475270; --tx3:#7280a0; --accent:#4f46e5; --other:#aab4c8;
  --glow:#e4e9f7; --bar:rgba(255,255,255,.85); --bar-f:rgba(255,255,255,.6); --nav:rgba(255,255,255,.6); --flowbar:rgba(255,255,255,.97); --tipbg:#ffffff;
  --wash:rgba(20,26,43,.03); --hov:#eef1f9; --link:#2563eb; --spark:#94a3b8; --cardtop:rgba(246,248,252,.9); --sqtx:#0b0f17;
  --b-ok:#047857; --b-bad:#dc2626; --b-warn:#b45309; --b-run:#0369a1; --b-vio:#7c3aed;
  --k-sessions:#059669; --k-tokens:#0284c7; --k-cost:#b45309; --k-time:#7c3aed; --k-proj:#db2777;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#f1f3f9; --line:#dfe4ef; --line2:#cbd2e2; --tx:#131a2c; --tx2:#475270; --tx3:#7280a0; --accent:#4f46e5; --other:#aab4c8;
  --glow:#e4e9f7; --bar:rgba(255,255,255,.85); --bar-f:rgba(255,255,255,.6); --nav:rgba(255,255,255,.6); --flowbar:rgba(255,255,255,.97); --tipbg:#ffffff;
  --wash:rgba(20,26,43,.03); --hov:#eef1f9; --link:#2563eb; --spark:#94a3b8; --cardtop:rgba(246,248,252,.9); --sqtx:#0b0f17;
  --b-ok:#047857; --b-bad:#dc2626; --b-warn:#b45309; --b-run:#0369a1; --b-vio:#7c3aed;
  --k-sessions:#059669; --k-tokens:#0284c7; --k-cost:#b45309; --k-time:#7c3aed; --k-proj:#db2777;
  }
}
*{box-sizing:border-box}
body{margin:0; background:radial-gradient(1200px 600px at 80% -10%,var(--glow) 0%,var(--bg) 55%) fixed; color:var(--tx);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased}
header{display:flex; flex-wrap:wrap; align-items:center; gap:14px 22px; padding:12px 32px; border-bottom:1px solid var(--line); background:var(--bar)}
.brand{display:flex; align-items:center; gap:10px}
.logo{font-size:22px; color:var(--accent)}
h1{font-size:15px; margin:0; font-weight:650}
.sub{font-size:12px; color:var(--tx3)}
main{padding:18px 20px 40px; max-width:1280px; margin:0 auto}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.kpi b{display:block; font-size:22px; font-weight:650; letter-spacing:-.01em}
.kpi span{font-size:12px; color:var(--tx2)}
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:16px}
.card h2{font-size:13px; margin:0 0 10px; font-weight:650; color:var(--tx2); text-transform:uppercase; letter-spacing:.04em}
.controls{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; margin-bottom:10px}
.delta{font-size:11.5px; font-weight:650; margin-left:6px; white-space:nowrap}
.delta.good{color:var(--b-ok)} .delta.bad{color:var(--b-warn)} .delta.flat{color:var(--tx2)}
.alert{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0}
.alert .body{flex:1; min-width:0}
.alert .ttl{font-weight:650}
.alert .dt{color:var(--tx2); font-size:12.5px; margin-top:2px}
.alert button.go{background:var(--panel2); color:var(--tx); border:1px solid var(--line2); border-radius:8px; padding:5px 10px; font:inherit; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap}
.alert button.go:hover{border-color:var(--accent)}
.limits{display:flex; flex-direction:column; gap:2px; margin-bottom:12px}
.limit{display:grid; grid-template-columns:minmax(160px,1fr) minmax(200px,1.4fr) 32px; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
.limit:first-child{border-top:0}
.limit .spent{font-size:12.5px; color:var(--tx2)}
.limit .meter{height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:5px}
.limit .meter i{display:block; height:100%; border-radius:4px}
.addlimit{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px}
.addlimit select,.addlimit input{background:var(--panel2); color:var(--tx); border:1px solid var(--line2); border-radius:8px; padding:6px 9px; font:inherit; font-size:13px}
.addlimit select[hidden]{display:none}
.addlimit input{width:110px}
.addlimit button.go{background:var(--accent); color:#fff; border:1px solid var(--accent); border-radius:8px; padding:7px 14px; font:inherit; font-size:13px; font-weight:600; cursor:pointer}
@media (max-width:760px){.limit{grid-template-columns:1fr 32px}.limit>div:nth-child(2){grid-column:1 / -1; order:3}}
.budget{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:6px}
.budget label{display:block; font-size:12px; color:var(--tx2); margin-bottom:4px}
.budget input{width:92px; background:var(--panel2); color:var(--tx); border:1px solid var(--line2); border-radius:8px; padding:5px 8px; font:inherit; font-size:13px}
.budget .meter{height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:6px}
.budget .meter i{display:block; height:100%; border-radius:4px}
.budget .spent{font-size:12.5px; color:var(--tx2); margin-top:4px}
.rangebtn{display:inline-flex; align-items:center; gap:9px; background:var(--panel2); color:var(--tx); border:1px solid var(--line2); border-radius:10px; padding:7px 13px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap}
.rangebtn:hover,.rangebtn[aria-expanded="true"]{border-color:var(--accent)}
.rangebtn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; color:var(--tx2)}
.rangepop{position:fixed; z-index:40; display:grid; grid-template-columns:minmax(0,auto) 170px; background:var(--panel); border:1px solid var(--line2); border-radius:14px; box-shadow:0 18px 60px rgba(0,0,0,.45); max-height:calc(100vh - 80px); overflow:auto}
.rangepop[hidden]{display:none}
.rangepop .cal{padding:16px 18px 12px}
.rangepop .months{display:flex; gap:28px}
.rangepop .mon{width:252px}
.rangepop .mh{display:grid; grid-template-columns:30px 1fr 30px; align-items:center; text-align:center; font-weight:650; margin-bottom:8px}
.rangepop .mh button{background:transparent; color:var(--tx2); border:0; border-radius:8px; height:28px; font-size:18px; cursor:pointer}
.rangepop .mh button:hover{background:var(--panel2); color:var(--tx)}
.rangepop .wd,.rangepop .days{display:grid; grid-template-columns:repeat(7,1fr); text-align:center}
.rangepop .wd span{font-size:12px; color:var(--tx2); padding:4px 0}
.rangepop .cd{background:transparent; color:var(--tx); border:0; border-radius:8px; height:34px; font:inherit; font-size:13.5px; cursor:pointer}
.rangepop .cd.out{color:var(--tx3); opacity:.55}
.rangepop .cd:hover:not(:disabled){background:var(--panel2)}
.rangepop .cd:disabled{opacity:.3; cursor:default}
.rangepop .cd.in{background:color-mix(in srgb,var(--accent) 16%,transparent); border-radius:0}
.rangepop .cd.edge{background:color-mix(in srgb,var(--accent) 38%,var(--panel2)); font-weight:700; box-shadow:inset 0 0 0 1px var(--accent)}
.rangepop .cd.today{text-decoration:underline; text-underline-offset:3px}
.rangepop .times{display:flex; flex-wrap:wrap; gap:18px 30px; margin-top:12px}
.rangepop .times .lbl{display:block; margin-bottom:5px; font-size:12.5px; color:var(--tx2)}
.rangepop .times select{background:var(--panel2); color:var(--tx); border:1px solid var(--line2); border-radius:8px; padding:6px 8px; font:inherit; font-size:13px}
.rangepop .foot{display:flex; align-items:center; gap:10px; justify-content:flex-end; margin-top:14px; padding-top:12px; border-top:1px solid var(--line)}
.rangepop .foot .err{margin-right:auto; color:var(--b-bad); font-size:12.5px}
.rangepop .foot button{background:var(--panel2); color:var(--tx); border:1px solid var(--line2); border-radius:9px; padding:7px 14px; font:inherit; font-size:13px; font-weight:600; cursor:pointer}
.rangepop .foot button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.rangepop .presets{border-left:1px solid var(--line); padding:12px 8px; display:flex; flex-direction:column; gap:2px}
.rangepop .presets button{background:transparent; color:var(--tx); border:0; border-radius:8px; padding:9px 10px; font:inherit; font-size:13.5px; text-align:center; cursor:pointer}
.rangepop .presets button:hover{background:var(--panel2)}
.rangepop .presets button[aria-current="true"]{background:color-mix(in srgb,var(--accent) 18%,transparent); font-weight:700}
@media (max-width:760px){.rangepop{grid-template-columns:1fr; left:8px; right:8px; width:auto}.rangepop .months{flex-direction:column; gap:12px}.rangepop .mon{width:100%}.rangepop .presets{border-left:0; border-top:1px solid var(--line); flex-direction:row; flex-wrap:wrap}}
.seg{display:inline-flex; border:1px solid var(--line2); border-radius:9px; overflow:hidden}
.seg button{background:transparent; color:var(--tx2); border:0; padding:6px 12px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button:hover{background:var(--panel2); color:var(--tx)}
.seg button[aria-pressed="true"]{background:var(--panel2); color:var(--tx); box-shadow:inset 0 -2px 0 var(--accent)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.lbl{font-size:12px; color:var(--tx3)}
#chart{width:100%; height:auto; display:block}
#chart text{fill:var(--tx3); font-size:11px}
#chart .grid{stroke:var(--line); stroke-width:1}
#chart rect.bar:hover{opacity:.8}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:8px; font-size:12px; color:var(--tx2)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); gap:16px}
.rank{display:grid; grid-template-columns:minmax(80px,1.1fr) 3fr auto; gap:6px 10px; align-items:center; font-size:13px}
.rank .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rank .track{height:8px; background:var(--panel2); border-radius:99px; overflow:hidden}
.rank .fill{height:100%; border-radius:99px}
.rank .val{color:var(--tx2); font-variant-numeric:tabular-nums; text-align:right}
.kinds{display:flex; height:14px; border-radius:99px; overflow:hidden; background:var(--panel2); margin:4px 0 10px}
.note{font-size:12px; color:var(--tx3); margin-top:8px}
.empty{padding:40px; text-align:center; color:var(--tx2)}
#tip{position:fixed; pointer-events:none; background:var(--tipbg); border:1px solid var(--line2); border-radius:8px; padding:8px 10px; font-size:12px; display:none; z-index:10; max-width:300px; box-shadow:0 6px 24px rgba(0,0,0,.4)}
#tip b{display:block; margin-bottom:2px}
#tip .r{display:flex; justify-content:space-between; gap:14px}
#filters{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:10px 32px; border-bottom:1px solid var(--line); background:var(--bar-f)}
#filters select,#filters input{background:var(--panel2); color:var(--tx); border:1px solid var(--line2); border-radius:9px; padding:6px 10px; font:inherit; font-size:12.5px; max-width:240px}
#filters input{min-width:280px}
#filters select:focus-visible,#filters input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
#filters .count{margin-left:auto; font-size:12px; color:var(--tx3)}
.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:7px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:11.5px; color:var(--tx3); font-weight:650; text-transform:uppercase; letter-spacing:.04em}
th button{all:unset; cursor:pointer; color:inherit; text-transform:inherit; letter-spacing:inherit}
th button:hover,th button:focus-visible{color:var(--tx)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
td.title{max-width:340px; overflow:hidden; text-overflow:ellipsis; color:var(--tx)}
td.dim{color:var(--tx2)}
tr:hover td{background:var(--wash)}
.tag{display:inline-block; padding:1px 8px; border-radius:99px; background:var(--panel2); border:1px solid var(--line2); font-size:11.5px; color:var(--tx2)}
.more{margin-top:10px}
.more button{background:var(--panel2); color:var(--tx); border:1px solid var(--line2); border-radius:9px; padding:6px 14px; font:inherit; font-size:12.5px; cursor:pointer}
/* ---- look: icon KPI cards, badges, sparklines, project bars ---- */
.kpis2{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:16px}
.kpi2{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:12px; padding:14px 16px 12px}
.kpi2 .top{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; color:var(--tx2)}
.kpi2 .top svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kpi2 .val{font-size:32px; font-weight:700; letter-spacing:-.02em; line-height:1.15; margin:6px 0 2px}
.kpi2 .sub{font-size:12.5px; color:var(--tx2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.badge{display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:7px; font-size:11px; font-weight:700; letter-spacing:.04em; border:1px solid}
.badge.ok{color:var(--b-ok); background:color-mix(in srgb,var(--b-ok) 11%,transparent); border-color:color-mix(in srgb,var(--b-ok) 38%,transparent)}
.badge.bad{color:var(--b-bad); background:color-mix(in srgb,var(--b-bad) 11%,transparent); border-color:color-mix(in srgb,var(--b-bad) 38%,transparent)}
.badge.warn{color:var(--b-warn); background:color-mix(in srgb,var(--b-warn) 11%,transparent); border-color:color-mix(in srgb,var(--b-warn) 38%,transparent)}
.badge.run{color:var(--b-run); background:color-mix(in srgb,var(--b-run) 11%,transparent); border-color:color-mix(in srgb,var(--b-run) 38%,transparent)}
.badge.mute{color:var(--tx2); background:var(--panel2); border-color:var(--line2)}
.avatar{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:6px; font-size:11px; font-weight:700; margin-right:8px; vertical-align:middle; color:#0b0f17}
.proj{display:flex; align-items:center; min-width:0}
.proj span.t{overflow:hidden; text-overflow:ellipsis}
.spark{display:inline-flex; align-items:flex-end; gap:2px; height:22px; margin-left:10px; vertical-align:middle}
.spark i{display:block; width:3px; min-height:2px; border-radius:1px; background:var(--tx3); opacity:.8}
.cell{display:flex; align-items:center; justify-content:flex-end; gap:0}
.pbar{display:flex; align-items:center; gap:10px; min-width:120px}
.pbar b{font-weight:600; min-width:2ch; text-align:right; font-variant-numeric:tabular-nums}
.pbar .track{flex:1; height:6px; border-radius:99px; background:var(--panel2); overflow:hidden}
.pbar .track i{display:block; height:100%; border-radius:99px}
.pager{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:12px; font-size:13px; color:var(--tx2)}
.pager button{background:var(--panel2); color:var(--tx); border:1px solid var(--line2); border-radius:9px; padding:5px 14px; font:inherit; font-size:12.5px; cursor:pointer}
.pager button:disabled{opacity:.4; cursor:default}
table.rich th{background:var(--wash); position:sticky; top:0}
table.rich th,table.rich td{padding-left:7px; padding-right:7px}
table.rich td{padding-top:10px; padding-bottom:10px}
table.rich td.title{max-width:250px}
table.rich .proj{max-width:165px}
table.rich .spark{margin-left:7px}
.card{background:linear-gradient(180deg,var(--cardtop),var(--panel))}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block; width:16px; height:16px; border:2px solid var(--line2); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-3px; margin-right:8px}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.loading{padding:18px 0; color:var(--tx2); font-size:13px}
/* sessions: link-like titles, icons, footer pager inside the card */
a.slink,.slink{color:var(--link); text-decoration:none}
tr:hover .slink{text-decoration:underline}
.ico{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; margin-right:7px; flex:none}
.ico.dim{color:var(--tx3)}
.badge .ico{width:12px; height:12px; margin-right:0}
.tablecard{padding:0; overflow:hidden}
.tablecard .tablewrap{padding:0 6px}
.tablecard .pager{margin:0; padding:12px; border-top:1px solid var(--line); justify-content:center}
.tablecard .note{padding:0 16px 12px; margin:0}
/* skills & MCP: one tile per row */
table.tiles{border-collapse:separate; border-spacing:0 8px; margin-top:-4px}
table.tiles td{background:var(--panel2); border:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding-top:12px; padding-bottom:12px}
table.tiles td:first-child{border-left:1px solid var(--line); border-radius:11px 0 0 11px}
table.tiles td:last-child{border-right:1px solid var(--line); border-radius:0 11px 11px 0}
table.tiles tr:hover td{background:var(--hov); border-color:var(--line2)}
table.tiles th{border:0}
.skill{display:flex; align-items:center; gap:12px; min-width:0}
.skill .sq{flex:none; display:grid; place-items:center; width:34px; height:34px; border-radius:9px; font-weight:700; font-size:14px; color:#0b0f17}
.skill .nm{display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; font-weight:600; color:var(--tx)}
.skill .ds{font-size:12px; color:var(--tx3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:520px; margin-top:2px}
.skill > div{min-width:0}
.badge.sm{padding:0 8px; font-size:10.5px}
.badge.vio{color:var(--b-vio); background:color-mix(in srgb,var(--b-vio) 11%,transparent); border-color:color-mix(in srgb,var(--b-vio) 38%,transparent)}
.spark.tall{height:30px; gap:2px; margin-left:12px}
.spark.tall i{width:4px; background:var(--spark); opacity:1; border-radius:1px}
.pbar .track{height:7px}
.fullbtn{display:block; width:100%; margin-top:6px; padding:11px; background:var(--panel2); color:var(--tx); border:1px solid var(--line); border-radius:11px; font:inherit; font-weight:600; cursor:pointer}
.fullbtn:hover{border-color:var(--line2)}
html:has(dialog#flow[open]),html:has(dialog#item[open]){overflow:hidden} /* the page behind the panel must not scroll */
dialog#flow,dialog#item{overflow:hidden; position:fixed; inset:0 0 0 auto; width:min(1120px,74vw); height:100%; max-width:none; max-height:none; margin:0; border:0; border-left:1px solid var(--line2); border-radius:0; box-shadow:-18px 0 50px rgba(0,0,0,.45); animation:drawer .18s ease-out}
dialog#flow::backdrop,dialog#item::backdrop{background:rgba(5,8,14,.5)}
dialog#flow[open],dialog#item[open]{display:flex; flex-direction:column}
dialog#item{width:min(620px,94vw)}
@keyframes drawer{from{transform:translateX(28px); opacity:0}to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){dialog#flow,dialog#item{animation:none}}

<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true">◍</span><div><h1>SkillMap · Global</h1><div class="sub" id="sub"></div></div></div>
  <div class="controls" style="margin:0 0 0 auto">
    <button type="button" class="close" id="themeBtn" aria-label="Switch between light and dark theme" title="Switch theme" style="padding:6px 10px"></button>
    <span class="lbl">Period</span>
    <button type="button" class="rangebtn" id="rangeBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="rangePop"></button>
  </div>
</header>
<div id="filters">
  <label class="lbl" for="fClient">Editor / client</label><select id="fClient"></select>
  <label class="lbl" for="fProject">Project</label><select id="fProject"></select>
  <input id="fSearch" type="search" placeholder="Search title, model, agent…" aria-label="Search sessions" autocomplete="off" />
  <span class="count" id="count"></span>
</div>
<div class="app">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="tip" role="tooltip"></div>
<dialog id="dlg" aria-label="Session detail"><div id="dlgBody"></div></dialog>
<dialog id="flow" aria-label="Session" tabindex="-1">
  <div class="flowbar"><b id="flowTitle"></b><button class="close" type="button" id="flowReload">Reload</button><a id="flowOpen" target="_blank" rel="noopener">Open in a tab ↗</a><button class="close" type="button" id="flowBack" aria-label="Close the session">✕</button></div>
  <div class="flowbody"><div class="loading" id="flowLoad"></div><iframe id="flowFrame" title="Session detail" src="about:blank"></iframe></div>
</dialog>
<div id="rangePop" class="rangepop" role="dialog" aria-label="Choose a period" hidden></div>
<dialog id="item" aria-label="Detail" tabindex="-1">
  <div class="flowbar"><b id="itemTitle"></b><button class="close" type="button" id="itemClose" aria-label="Close the detail">✕</button></div>
  <div class="itembody" id="itemBody"></div>
</dialog>
<script>
const DATA = __DATA__;
const $ = (s) => document.querySelector(s);
const PALETTE = ['--c0','--c1','--c2','--c3','--c4','--c5','--c6','--c7'];
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const fmtTok = (n) => n >= 1e9 ? (n / 1e9).toFixed(1) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n));
const fmtCost = (n) => (n >= 100 ? '$' + Math.round(n) : '$' + n.toFixed(2));
const fmtMs = (ms) => ms >= 3600000 ? (ms / 3600000).toFixed(1) + ' h' : ms >= 60000 ? Math.round(ms / 60000) + ' min' : Math.round(ms / 1000) + ' s';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tokAll = (t) => t.input + t.output + t.reasoning + t.cacheRead + t.cacheWrite;
const tokLive = (t) => t.input + t.output + t.reasoning + t.cacheWrite; // everything but cache reads

const ICONS = {
  pulse: '<svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-7 5 14 2.5-7H21"/></svg>',
  layers: '<svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>',
  dollar: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  map: '<svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
};
const IC = {
  clock: '<svg class="ico dim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  terminal: '<svg class="ico dim" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>',
  code: '<svg class="ico dim" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>',
  hex: '<svg class="ico dim" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m12 12 8-4.5M12 12v9M12 12 4 7.5"/></svg>',
  check: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
  x: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>',
  warn: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/></svg>',
  run: '<svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>',
  dot: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>',
};
const clientIcon = (c) => (c === 'Terminal' ? IC.terminal : c === 'VS Code' ? IC.code : IC.hex);
const SUN = '<svg class="ico" style="margin:0" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>';
const MOON = '<svg class="ico" style="margin:0" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
const effTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
function paintThemeBtn() { $('#themeBtn').innerHTML = effTheme() === 'light' ? MOON : SUN; } // the icon is what you switch to
$('#themeBtn').onclick = () => {
  const next = effTheme() === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('skillmap-theme', next); } catch { /* not remembered */ }
  saveSettings({ theme: next });
  render();
};
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) render(); });
const hash = (str) => { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const avatar = (dir) => { const label = projectOf({ directory: dir }); const base = label.split('/').pop() || '?'; return `<span class="avatar" style="background:${css(PALETTE[hash(dir || '') % PALETTE.length])}" aria-hidden="true">${esc(base[0].toUpperCase())}</span>`; };
const spark = (vals, tall) => { const h = tall ? 30 : 22, max = Math.max(...vals, 1); return `<span class="spark${tall ? ' tall' : ''}" aria-hidden="true">${vals.map((v) => `<i style="height:${v ? Math.max(3, Math.round((v / max) * h)) : 2}px"></i>`).join('')}</span>`; };
const RESULT = { completed: ['COMPLETED', 'ok', 'check'], error: ['ERROR', 'bad', 'x'], aborted: ['ABORTED', 'warn', 'warn'], empty: ['EMPTY', 'mute', 'dot'] };
const resultOf = (t) => (t.outcome === 'incomplete' ? (isRunning(t) ? ['RUNNING', 'run', 'run'] : ['INCOMPLETE', 'mute', 'dot']) : RESULT[t.outcome] || [String(t.outcome).toUpperCase(), 'mute', 'dot']);

const isRunning = (t) => t.outcome === 'incomplete' && Date.now() - t.end < 300000;
const RUNTIME = { opencode: 'OpenCode', 'claude-code': 'Claude Code' };
const CLIENT = { cli: 'Terminal', 'claude-vscode': 'VS Code', 'claude-desktop': 'Desktop', 'sdk-ts': 'SDK', 'sdk-py': 'SDK', 'sdk-cli': 'SDK', 'mcp': 'MCP', 'local-agent': 'Desktop agent' };
const clientOf = (r) => r.runtime === 'opencode' ? 'OpenCode' : (r.client ? (CLIENT[r.client] || r.client) : 'Claude Code');
// a worktree reads as "repo · worktree", not as a folder called worktrees/<name>
const projectOf = (r) => {
  const dir = r.directory || '';
  const wt = /([^/\\]+)[/\\]\.claude[/\\]worktrees[/\\]([^/\\]+)/.exec(dir);
  return wt ? `${wt[1]} · ${wt[2]}` : dir.split(/[\\/]/).filter(Boolean).slice(-2).join('/') || '(unknown)';
};

const METRICS = {
  cost: { label: 'Cost', val: (r) => r.cost, fmt: fmtCost },
  tokens: { label: 'Tokens', val: (r) => tokAll(r.tokens), fmt: fmtTok },
  fresh: { label: 'Tokens without cache reads', val: (r) => tokLive(r.tokens), fmt: fmtTok },
};
const GROUPS = {
  project: { label: 'Project', key: projectOf },
  client: { label: 'Editor / client', key: clientOf },
  model: { label: 'Model', key: (r) => r.model || '(unknown)' },
  agent: { label: 'Agent', key: (r) => r.agent || (r.parent ? 'subagent' : 'main') },
};
const MIN = 60000, HOUR = 3600000;
const RANGE_RE = /^(\d+)\s*([mhd])$/i;
const ABS_RE = /^abs:(\d+):(\d+|now)$/; // a window picked on the calendar: from, to (or now, still moving)
const validRange = (k) => k === 'all' || ABS_RE.test(k) || (RANGE_RE.test(k) && Number(RANGE_RE.exec(k)[1]) > 0);
const isAbs = () => ABS_RE.test(st.range);
const PRESETS = [['1h', 'Last hour'], ['6h', 'Last 6 hours'], ['24h', 'Last 24 hours'], ['7d', 'Last 7 days'], ['30d', 'Last 30 days'], ['1d', 'Today'], ['week', 'This week'], ['month', 'This month'], ['all', 'All loaded']];
// This week and This month are windows from their start until now
function presetValue(k) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (k === 'week') { d.setDate(d.getDate() - d.getDay()); return `abs:${d.getTime()}:now`; }
  if (k === 'month') { d.setDate(1); return `abs:${d.getTime()}:now`; }
  return k;
}

const VIEWS = [['overview', 'Overview'], ['sessions', 'Sessions'], ['projects', 'Projects'], ['usage', 'Skills & MCP'], ['insights', 'Insights'], ['alerts', 'Alerts']];
const viewFromHash = () => { const v = location.hash.slice(1); return VIEWS.some(([k]) => k === v) ? v : 'overview'; };
// served: the settings also go to the server's file, so a new port or browser keeps them
function saveSettings(patch) {
  if (!DATA.live) return;
  DATA.settings = { ...(DATA.settings || {}), ...patch };
  fetch('settings', { method: 'POST', headers: { 'content-type': 'application/json', 'x-skillmap': '1' }, body: JSON.stringify(patch) }).catch(() => { /* the server is gone: the browser copy remains */ });
}
const st = { view: viewFromHash(), metric: 'cost', group: 'project', range: (() => { try { const k = presetValue(new URLSearchParams(location.search).get('range') || (DATA.live && DATA.settings?.range) || localStorage.getItem('skillmap-range') || ''); if (k && validRange(k)) return k; } catch { /* not remembered */ } return '30d'; })(), client: '', project: '', q: '', sort: 'start', psort: 'last', plimit: 25, page: 0, usage: 'skills', usageLimit: 25 };
const dayStart = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
// a calendar day later: days are 23 or 25 hours long when the clocks change
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
// a round axis step at or above `x`/4
const niceStep = (x) => { const p = 10 ** Math.floor(Math.log10(x)); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };
const dayLabel = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

// minutes and hours are a rolling window ending now; days are calendar days, today included
function rangeFrom() {
  const a = ABS_RE.exec(st.range);
  if (a) return Number(a[1]);
  const m = RANGE_RE.exec(st.range);
  if (!m) return 0;
  const n = Number(m[1]), unit = m[2].toLowerCase();
  return unit === 'd' ? addDays(dayStart(Date.now()), -(n - 1)) : Date.now() - n * (unit === 'h' ? HOUR : MIN);
}
const rangeTo = () => { const a = ABS_RE.exec(st.range); return a && a[2] !== 'now' ? Number(a[2]) : Date.now(); };
// chart buckets: a short window is cut finer than a day
const DAY_GRAIN = { unit: 'day', floor: dayStart, next: (t) => addDays(t, 1), label: dayLabel, full: dayLabel };
const timeOf = (t) => new Date(t).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const dayTime = (t) => `${dayLabel(t)} ${timeOf(t)}`;
const HOUR_GRAIN = { unit: 'hour', floor: (t) => { const d = new Date(t); d.setMinutes(0, 0, 0); return d.getTime(); }, next: (t) => t + HOUR, label: timeOf, full: dayTime };
const FIVE_GRAIN = { unit: '5 min', floor: (t) => Math.floor(t / (5 * MIN)) * 5 * MIN, next: (t) => t + 5 * MIN, label: timeOf, full: dayTime };
function grainOf() {
  const m = RANGE_RE.exec(st.range);
  if (!isAbs() && (!m || m[2].toLowerCase() === 'd')) return DAY_GRAIN;
  const ms = isAbs() ? rangeTo() - rangeFrom() : Number(m[1]) * (m[2].toLowerCase() === 'h' ? HOUR : MIN);
  return ms <= 3 * HOUR ? FIVE_GRAIN : ms <= 48 * HOUR ? HOUR_GRAIN : DAY_GRAIN;
}
function periodRows() {
  const from = rangeFrom(), to = rangeTo();
  // a session that began earlier but is working now still belongs in a period that reaches the present
  const open = !isAbs() || ABS_RE.exec(st.range)[2] === 'now';
  return DATA.rows.filter((r) => (r.start >= from && r.start <= to) || (open && isRunning(r)));
}
// the period before this one, same length: the comparison for the cards
const ageOf = (k) => { const m = RANGE_RE.exec(k); return m ? Number(m[1]) * { m: MIN, h: HOUR, d: 86400000 }[m[2].toLowerCase()] : 0; };
function prevWindow() {
  const m = RANGE_RE.exec(st.range);
  if (!m && !isAbs()) return null;
  const from = rangeFrom();
  const n = m ? Number(m[1]) : 0, unit = m ? m[2].toLowerCase() : '';
  const prevFrom = isAbs() ? from - (rangeTo() - from) : unit === 'd' ? addDays(from, -n) : from - n * (unit === 'h' ? HOUR : MIN);
  const loadedFrom = new Date(DATA.generatedAt).getTime() - ageOf(DATA.since);
  return { from: prevFrom, to: from, covered: prevFrom >= loadedFrom, needs: Math.ceil((Date.now() - prevFrom) / 86400000) };
}
const totalsOf = (rows) => {
  const top = rows.filter((r) => !r.parent);
  return { sessions: top.length, tokens: rows.reduce((n, r) => n + tokAll(r.tokens), 0), cost: rows.reduce((n, r) => n + r.cost, 0), ms: rows.reduce((n, r) => n + r.activeMs, 0) };
};
// ▲/▼ with the change; for cost and tokens a rise is the bad direction
function deltaOf(cur, prev, { upIsBad = true, label = '' } = {}) {
  if (prev == null) return '';
  if (!prev) return cur ? `<span class="delta flat" title="Nothing in the previous period">new</span>` : '';
  const pct = ((cur - prev) / prev) * 100;
  if (Math.abs(pct) < 1) return `<span class="delta flat" title="vs the previous period${label}">= 0%</span>`;
  const up = pct > 0, cls = upIsBad === null ? 'flat' : up === upIsBad ? 'bad' : 'good';
  return `<span class="delta ${cls}" title="vs the previous period${label}">${up ? '▲' : '▼'} ${Math.abs(pct) >= 100 ? Math.round(Math.abs(pct)) : Math.abs(pct).toFixed(0)}%</span>`;
}
const median = (a) => { const v = [...a].sort((x, y) => x - y); return v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : 0; };

// a subagent session follows its parent's client and project filters
let sessionIndex = new Map(DATA.rows.map((r) => [r.id, r]));
const rootOf = (r) => { while (r.parent && sessionIndex.has(r.parent)) r = sessionIndex.get(r.parent); return r; };
const haystack = (r) => [r.title, r.model, r.agent, r.directory].join(' ').toLowerCase();
function passes(r) {
  const q = st.q.trim().toLowerCase(), root = rootOf(r);
  return (!st.client || clientOf(root) === st.client) && (!st.project || root.directory === st.project) && (!q || haystack(r).includes(q) || haystack(root).includes(q));
}
const visibleRows = () => periodRows().filter(passes);

function fillSelect(el, key, entries, all) {
  el.innerHTML = `<option value="">${esc(all)}</option>` + entries.map(([v, label]) => `<option value="${esc(v)}"${st[key] === v ? ' selected' : ''}>${esc(label)}</option>`).join('');
  el.onchange = () => { st[key] = el.value; st.page = 0; render(); };
}
function renderFilters() {
  const rows = periodRows().map(rootOf);
  fillSelect($('#fClient'), 'client', [...new Set(rows.map(clientOf))].sort().map((c) => [c, c]), 'All');
  const dirs = new Map();
  for (const r of rows) dirs.set(r.directory, projectOf(r));

// ---------- period picker: calendar, times and quick ranges ----------
const fmtDT = (t) => new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
const tzName = () => new Date().toLocaleTimeString(undefined, { timeZoneName: 'short' }).split(' ').pop();
function paintRangeBtn() {
  const text = st.range === 'all' ? 'All loaded' : `${fmtDT(rangeFrom())} – ${fmtDT(rangeTo())} · ${tzName()}`;
  $('#rangeBtn').innerHTML = `${ICONS.cal}<span>${esc(text)}</span>`;
}
const pop = { open: false, touched: false, view: 0, a: null, b: null, hover: null, from: { h: 12, m: 0, ap: 'AM' }, to: { h: 11, m: 59, ap: 'PM' }, err: '' };
const split12 = (t) => { const d = new Date(t); return { h: d.getHours() % 12 || 12, m: d.getMinutes(), ap: d.getHours() < 12 ? 'AM' : 'PM' }; };
const join12 = (day, t) => { const d = new Date(day); d.setHours((t.h % 12) + (t.ap === 'PM' ? 12 : 0), t.m, 0, 0); return d.getTime(); };
const monthStart = (t, n = 0) => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth() + n, 1).getTime(); };
const WEEKDAYS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

function monthHtml(first, nav) {
  const d0 = new Date(first), y = d0.getFullYear(), mo = d0.getMonth();
  const lead = new Date(y, mo, 1).getDay(), count = new Date(y, mo + 1, 0).getDate(), weeks = Math.ceil((lead + count) / 7);
  const lo = pop.a == null ? null : Math.min(pop.a, pop.b ?? pop.hover ?? pop.a), hi = pop.a == null ? null : Math.max(pop.a, pop.b ?? pop.hover ?? pop.a);
  const today = dayStart(Date.now());
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(y, mo, 1 - lead + i), t = d.getTime(), out = d.getMonth() !== mo;
    const cls = [out ? 'out' : '', !out && lo != null && (t === lo || t === hi) ? 'edge' : '', !out && lo != null && t > lo && t < hi ? 'in' : '', t === today ? 'today' : ''].filter(Boolean).join(' ');
    cells += `<button type="button" class="cd ${cls}" data-t="${t}" ${t > today ? 'disabled' : ''}${t === lo || t === hi ? ' aria-pressed="true"' : ''}>${d.getDate()}</button>`;
  }
  return `<div class="mon"><div class="mh">${nav === 'prev' ? '<button type="button" data-nav="-1" aria-label="Previous month">‹</button>' : '<span></span>'}<span>${esc(d0.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }))}</span>${nav === 'next' ? '<button type="button" data-nav="1" aria-label="Next month">›</button>' : '<span></span>'}</div>
    <div class="wd">${WEEKDAYS.map((w) => `<span>${w}</span>`).join('')}</div><div class="days">${cells}</div></div>`;
}
const drawMonths = () => { $('#popMonths').innerHTML = monthHtml(pop.view, 'prev') + monthHtml(monthStart(pop.view, 1), 'next'); };
const timeSelects = (key, t) => `<span><select data-t="${key}" data-f="h" aria-label="${key} hour">${Array.from({ length: 12 }, (_, i) => `<option ${t.h === i + 1 ? 'selected' : ''}>${String(i + 1).padStart(2, '0')}</option>`).join('')}</select>
  : <select data-t="${key}" data-f="m" aria-label="${key} minute">${Array.from({ length: 60 }, (_, i) => `<option ${t.m === i ? 'selected' : ''}>${String(i).padStart(2, '0')}</option>`).join('')}</select>

function openPop() {

    // whole days unless the times were set by hand

// ---------- alerts: cost limits per project, model, agent or client, and unusually costly sessions and days ----------
const LIMIT_SCOPES = [['all', 'Everything'], ['project', 'Project'], ['model', 'Model'], ['agent', 'Agent'], ['client', 'Editor / client']];
const LIMIT_PERIODS = [['day', 'Per day'], ['week', 'Last 7 days'], ['month', 'This month'], ['session', 'Per session']];
const limits = (() => {
  try {
    const saved = (DATA.live && DATA.settings?.limits) || JSON.parse(localStorage.getItem('skillmap-limits') || 'null');
    if (Array.isArray(saved)) return saved;
    // the daily and weekly budget of an earlier version become limits on everything
    const b = (DATA.live && DATA.settings?.budget) || JSON.parse(localStorage.getItem('skillmap-budget') || '{}');
    return [['day', b.day], ['week', b.week]].filter(([, v]) => Number(v) > 0).map(([period, v]) => ({ id: 'old-' + period, scope: 'all', value: '', period, limit: Number(v) }));
  } catch { return []; }
})();
const floors = (() => { try { const f = (DATA.live && DATA.settings?.floors) || JSON.parse(localStorage.getItem('skillmap-floors') || 'null') || {}; return { session: Number.isFinite(Number(f.session)) && f.session !== undefined ? Number(f.session) : 3, day: Number.isFinite(Number(f.day)) && f.day !== undefined ? Number(f.day) : 5 }; } catch { return { session: 3, day: 5 }; } })();
function saveLimits() {
  try { localStorage.setItem('skillmap-limits', JSON.stringify(limits)); localStorage.setItem('skillmap-floors', JSON.stringify(floors)); } catch { /* not remembered */ }
  saveSettings({ limits, floors });
}

// does a session row count towards a limit?
function inScope(l, r) {
  const root = rootOf(r);
  switch (l.scope) {
    case 'all': return true;
    case 'project': return root.directory === l.value;
    case 'model': return (r.model || '(unknown)') === l.value;
    case 'agent': return GROUPS.agent.key(r) === l.value;
    case 'client': return clientOf(root) === l.value;
    default: return false;
  }
}
const scopeLabel = (l) => (l.scope === 'all' ? 'Everything' : l.scope === 'project' ? projectOf({ directory: l.value }) : l.scope === 'agent' ? `Agent ${l.value}` : l.value);
const periodLabel = (p) => LIMIT_PERIODS.find(([k]) => k === p)[1].toLowerCase();
const periodStart = (p) => (p === 'day' ? dayStart(Date.now()) : p === 'week' ? addDays(dayStart(Date.now()), -6) : monthStart(Date.now()));
// what a limit has used so far: the total of its period, or the sessions over it
function limitState(l) {
  if (l.period === 'session') {
    const fam = new Map();
    for (const r of DATA.rows) if (inScope(l, r)) { const id = rootOf(r).id; fam.set(id, (fam.get(id) || 0) + r.cost); }
    const over = [...fam].filter(([, c]) => c > l.limit).sort((a, b) => b[1] - a[1]);
    return { over, spent: Math.max(0, ...fam.values()) };
  }
  const from = periodStart(l.period);
  return { over: [], spent: DATA.rows.filter((r) => r.start >= from && inScope(l, r)).reduce((n, r) => n + r.cost, 0) };
}
// a way to see the sessions behind a limit
const filterFor = (l) => ({ scope: l.scope, value: l.value });

// a session with its subagents' cost added
function familyCosts(rows) {
  const m = new Map();
  for (const r of rows) { const root = rootOf(r); m.set(root.id, (m.get(root.id) || 0) + r.cost); }
  return m;
}
function alertsOf(rows) {
  const out = [];
  for (const l of limits) {
    const { over, spent } = limitState(l), who = scopeLabel(l);
    if (l.period === 'session') {
      if (over.length) {
        const t = sessionIndex.get(over[0][0]);
        out.push({ sev: 'bad', title: `${who}: ${over.length} session${over.length === 1 ? '' : 's'} over ${fmtCost(l.limit)}`, detail: `The costliest: ${t?.title || over[0][0]} at ${fmtCost(over[0][1])}.`, go: { session: over[0][0] } });
      }
    } else if (spent > l.limit) {
      out.push({ sev: 'bad', title: `${who}: limit exceeded, ${fmtCost(spent)} of ${fmtCost(l.limit)}`, detail: `${periodLabel(l.period)}; a session counts on the day it started.`, go: { filter: filterFor(l) } });
    } else if (spent > l.limit * 0.8) {
      out.push({ sev: 'warn', title: `${who}: close to the limit, ${fmtCost(spent)} of ${fmtCost(l.limit)}`, detail: `Over 80% already (${periodLabel(l.period)}).`, go: { filter: filterFor(l) } });
    }
  }

  const fam = familyCosts(rows), costs = [...fam.values()].filter((c) => c > 0), med = median(costs);
  const floor = Math.max(floors.session, med * 4);
  const big = [...fam].filter(([, c]) => c >= floor && c > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);
  for (const [id, c] of big) {
    const t = sessionIndex.get(id);
    out.push({ sev: 'warn', title: `Costly session: ${t?.title || id}`, detail: `${fmtCost(c)} with its subagents, ${med ? (c / med).toFixed(0) + '× the median session' : ''} · ${projectOf(t)}`, go: { session: id } });
  }

  const perDay = new Map();
  for (const r of rows) perDay.set(dayStart(r.start), (perDay.get(dayStart(r.start)) || 0) + r.cost);
  const dayMed = median([...perDay.values()].filter((c) => c > 0));
  for (const [d, c] of [...perDay].sort((a, b) => b[1] - a[1]).slice(0, 3)) {
    if (perDay.size >= 4 && c >= Math.max(floors.day, dayMed * 2.5) && c > 0) out.push({ sev: 'warn', title: `Spending spike on ${dayLabel(d)}: ${fmtCost(c)}`, detail: `${(c / dayMed).toFixed(1)}× a usual day (${fmtCost(dayMed)})`, go: { day: d } });
  }
  return out;
}

// ---------- insights across every project ----------
function insightsOf(rows, top) {
  const out = [];
  const total = totalsOf(rows);
  const byProj = new Map();
  for (const r of rows) {
    const key = rootOf(r).directory;
    const p = byProj.get(key) || { dir: key, sessions: 0, bad: 0, cost: 0, subCost: 0, cacheRead: 0, input: 0, cacheWrite: 0 };
    if (!r.parent) { p.sessions++; if (r.outcome === 'error' || r.outcome === 'aborted') p.bad++; }
    p.cost += r.cost;
    if (r.parent) p.subCost += r.cost;
    p.cacheRead += r.tokens.cacheRead; p.input += r.tokens.input; p.cacheWrite += r.tokens.cacheWrite;
    byProj.set(key, p);
  }
  const projects = [...byProj.values()];
  const showProj = (dir) => ({ view: 'sessions', project: dir });

  for (const p of projects.filter((p) => p.sessions >= 3 && p.bad / p.sessions >= 0.25).sort((a, b) => b.bad / b.sessions - a.bad / a.sessions).slice(0, 3)) {
    out.push({ sev: 'warn', title: `${projectOf({ directory: p.dir })}: ${p.bad} of ${p.sessions} sessions ended in error or were aborted`, detail: `${Math.round((p.bad / p.sessions) * 100)}% — worth opening a few to see what stops them.`, go: showProj(p.dir) });
  }

  // MCP servers that fail often
  const mcp = new Map();
  for (const r of rows) for (const [name, v] of Object.entries(r.usage?.mcp || {})) {
    const e = mcp.get(name) || { calls: 0, errors: 0 };
    e.calls += v.calls; e.errors += v.errors || 0;
    mcp.set(name, e);
  }
  for (const [name, e] of [...mcp].filter(([, e]) => e.calls >= 5 && e.errors / e.calls >= 0.2).sort((a, b) => b[1].errors - a[1].errors).slice(0, 3)) {
    out.push({ sev: 'warn', title: `MCP server ${name} fails ${Math.round((e.errors / e.calls) * 100)}% of the time`, detail: `${e.errors} errors in ${e.calls} calls. A server that often fails costs retries and tokens.`, go: { view: 'usage', usage: 'mcp' } });
  }

  // little cache reuse (a runtime that reports no cache reads says nothing, so those are skipped)
  for (const p of projects.filter((p) => p.cacheRead > 0 && p.cacheRead + p.input + p.cacheWrite > 2e6).map((p) => ({ ...p, hit: p.cacheRead / (p.cacheRead + p.input + p.cacheWrite) })).filter((p) => p.hit < 0.5).sort((a, b) => a.hit - b.hit).slice(0, 2)) {
    out.push({ sev: 'info', title: `${projectOf({ directory: p.dir })}: only ${Math.round(p.hit * 100)}% of the input came from cache`, detail: 'Frequent changes to the start of the context (instructions, tools, skills) break the cache and cost more.', go: showProj(p.dir) });
  }

  // subagents carrying the cost
  for (const p of projects.filter((p) => p.cost >= 5 && p.subCost / p.cost >= 0.6).sort((a, b) => b.subCost - a.subCost).slice(0, 2)) {
    out.push({ sev: 'info', title: `${projectOf({ directory: p.dir })}: ${Math.round((p.subCost / p.cost) * 100)}% of the cost is subagents`, detail: `${fmtCost(p.subCost)} of ${fmtCost(p.cost)}. Check that each delegation earns its cost, and which model the subagents use.`, go: showProj(p.dir) });
  }

  // one project taking most of the spend
  const topProj = [...projects].sort((a, b) => b.cost - a.cost)[0];
  if (topProj && projects.length > 2 && total.cost > 0 && topProj.cost / total.cost >= 0.5) {
    out.push({ sev: 'info', title: `${projectOf({ directory: topProj.dir })} is ${Math.round((topProj.cost / total.cost) * 100)}% of the cost`, detail: `${fmtCost(topProj.cost)} of ${fmtCost(total.cost)} in this selection.`, go: showProj(topProj.dir) });
  }

  // one model taking most of the spend
  const models = new Map();
  for (const r of rows) models.set(r.model || '(unknown)', (models.get(r.model || '(unknown)') || 0) + r.cost);
  const [mName, mCost] = [...models].sort((a, b) => b[1] - a[1])[0] || [];
  if (mName && total.cost > 0 && mCost / total.cost >= 0.7 && models.size > 1) {
    out.push({ sev: 'info', title: `${mName} is ${Math.round((mCost / total.cost) * 100)}% of the cost`, detail: 'A lighter model for simple or repetitive work can cut that share.' });
  }

  // sessions left open
  const stale = top.filter((t) => t.outcome === 'incomplete' && !isRunning(t) && Date.now() - t.end > 86400000);
  if (stale.length >= 3) out.push({ sev: 'info', title: `${stale.length} sessions never finished`, detail: 'They stopped mid-turn more than a day ago: closed terminals or crashes.', go: { view: 'sessions' } });

  // installed but unused
  const un = unusedOf(rows);
  if (un.length) out.push({ sev: 'info', title: `${un.length} installed skills and MCP servers were not used in this selection`, detail: 'Each loaded skill and server adds to the context every session starts with.', go: { view: 'usage', usage: 'unused' } });

  const rank = { bad: 0, warn: 1, info: 2, ok: 3 };
  return out.sort((a, b) => rank[a.sev] - rank[b.sev]);
}

const PAGE = 20;

  const agg = new Map(top.map((t) => [t.id, { subs: 0, tokens: tokAll(t.tokens), cost: t.cost, ms: t.activeMs }]));

  // sessions working right now come first, whatever the sort: they started long ago and would sit pages away

  const pages = Math.max(1, Math.ceil(list.length / PAGE));

    <div class="pager"><button type="button" id="first" ${st.page === 0 ? 'disabled' : ''}>First</button><button type="button" id="prev" ${st.page === 0 ? 'disabled' : ''}>Previous</button><span>Page ${st.page + 1} of ${pages}</span><button type="button" id="next" ${st.page >= pages - 1 ? 'disabled' : ''}>Next</button><button type="button" id="last" ${st.page >= pages - 1 ? 'disabled' : ''}>Last</button></div>

// skills, subagent types and MCP servers across the sessions on screen, one kind at a time
const USAGE = {
  skills: { label: 'Skills', unit: 'Calls', pick: (u) => u.skills || {} },
  agents: { label: 'Subagent types', unit: 'Runs', pick: (u) => u.agents || {} },
  mcp: { label: 'MCP servers', unit: 'Calls', pick: (u) => u.mcp || {}, errors: true },
  unused: { label: 'Unused', unit: '', pick: () => ({}) }, // installed, not called: listed apart
};
let usageEntries = new Map();
function drawUsage(rows) {
  const U = USAGE[st.usage];
  const startDay = Math.min(...rows.map((r) => dayStart(r.start)));
  const nDays = Math.min(14, Math.round((dayStart(Date.now()) - startDay) / 86400000) + 1);
  const dayIndex = (t) => nDays - 1 - Math.round((dayStart(Date.now()) - dayStart(t)) / 86400000);
  const allProjects = new Set(rows.map((r) => rootOf(r).directory)).size;
  const m = new Map();
  for (const r of rows) {
    const root = rootOf(r);
    for (const [name, v] of Object.entries(U.pick(r.usage || {}))) {
      const e = m.get(name) || { calls: 0, errors: 0, sessions: new Set(), projects: new Set(), tools: {}, last: 0, perDay: new Array(nDays).fill(0), sessDay: new Array(nDays).fill(0), bySess: new Map(), byProj: new Map() };
      const c = v.calls ?? v;
      e.calls += c;
      e.errors += v.errors || 0;
      e.sessions.add(root.id);
      e.projects.add(root.directory);
      e.last = Math.max(e.last, r.start);
      const ss = e.bySess.get(root.id) || { calls: 0, errors: 0 };
      ss.calls += c; ss.errors += v.errors || 0;
      e.bySess.set(root.id, ss);
      const pp = e.byProj.get(root.directory) || { calls: 0, sessions: new Set() };
      pp.calls += c; pp.sessions.add(root.id);
      e.byProj.set(root.directory, pp);
      const i = dayIndex(r.start);
      if (i >= 0) { e.perDay[i] += c; e.sessDay[i] += 1; }
      for (const [t, n] of Object.entries(v.tools || {})) e.tools[t] = (e.tools[t] || 0) + n;
      m.set(name, e);
    }
  }
  usageEntries = m;
  const list = [...m].sort((a, b) => b[1].calls - a[1].calls);
  const counts = Object.fromEntries(Object.entries(USAGE).map(([k, u]) => [k, new Set(rows.flatMap((r) => Object.keys(u.pick(r.usage || {})))).size]));
  const unusedList = unusedOf(rows);
  counts.unused = unusedList.length;
  seg($('#usageTab'), Object.entries(USAGE).map(([k, u]) => [k, `${u.label} ${counts[k]}`]), 'usage');
  if (st.usage === 'unused') return drawUnused(unusedList);
  const when = (t) => new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const el = $('#usageTable');
  const recent = Date.now() - 3 * 86400000;
  const share = (n) => n / Math.max(1, allProjects);
  const tone = (n) => (share(n) >= 0.5 ? 'var(--b-ok)' : share(n) >= 0.2 ? 'var(--b-vio)' : 'var(--b-warn)');
  const nameCell = (name, e) => {
    const info = st.usage === 'skills' ? (DATA.skills || {})[name] : null;
    const badges = [e.last >= recent ? '<span class="badge ok sm">Active</span>' : '', info ? `<span class="badge ${info.scope === 'global' ? 'vio' : 'run'} sm">${info.scope === 'global' ? 'Global' : 'Project'}</span>` : '', st.usage === 'mcp' ? `<span class="badge mute sm">${Object.keys(e.tools).length} tools</span>` : ''].join('');
    return `<div class="skill"><span class="sq" style="background:${css(PALETTE[hash(name) % PALETTE.length])}" aria-hidden="true">${esc(name[0].toUpperCase())}</span><div><div class="nm">${esc(name)}${badges}</div>${info?.description ? `<div class="ds" title="${esc(info.description)}">${esc(info.description)}</div>` : st.usage === 'mcp' ? `<div class="ds">${Object.entries(e.tools).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([n]) => esc(n)).join(', ')}</div>` : ''}</div></div>`;
  };
  el.innerHTML = list.length ? `<table class="rich tiles">
      <thead><tr><th>${esc(U.label.replace(/s$/, ''))}</th><th class="num">${U.unit}</th>${U.errors ? '<th class="num">Errors</th>' : ''}<th class="num">Sessions</th><th>Projects</th><th>Last used</th></tr></thead>
      <tbody>${list.slice(0, st.usageLimit).map(([name, e]) => `<tr data-name="${esc(name)}" tabindex="0" role="button" aria-label="Open ${esc(name)}">
          <td>${nameCell(name, e)}</td>
          <td class="num"><span class="cell">${e.calls}${spark(e.perDay, true)}</span></td>${U.errors ? `<td class="num">${e.errors || ''}</td>` : ''}
          <td class="num"><span class="cell">${e.sessions.size}${spark(e.sessDay, true)}</span></td>
          <td><span class="pbar"><b>${e.projects.size}</b><span class="track"><i style="width:${Math.max(3, share(e.projects.size) * 100)}%; background:${tone(e.projects.size)}"></i></span></span></td>
          <td class="dim" style="white-space:nowrap">${when(e.last)}</td></tr>`).join('')}</tbody></table>
      ${list.length > st.usageLimit ? `<button type="button" class="fullbtn" id="moreUsage">Show more (${list.length - st.usageLimit} left) ›</button>` : ''}
      <p class="note">Bars show calls and sessions per day over the last ${nDays} days. The project bar is the share of the ${allProjects} projects on screen. “Active” = used in the last 3 days.${U.errors ? '' : ''}</p>`
    : '<p class="note">None in this selection.</p>';
  el.onclick = (e) => {
    if (e.target.closest('#moreUsage')) { st.usageLimit += 25; render(); return; }
    const tr = e.target.closest('tr[data-name]');
    if (tr) openItem(tr.dataset.name);
  };
  el.onkeydown = (e) => {
    const tr = e.target.closest('tr[data-name]');
    if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openItem(tr.dataset.name); }
  };
}

// one skill, subagent type or MCP server: what it is, where it is used and by which sessions
function openItem(name) {
  const e = usageEntries.get(name), U = USAGE[st.usage];
  if (!e) return;
  const kind = st.usage, info = kind === 'skills' ? (DATA.skills || {})[name] : null;
  const when = (t) => new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const maxTool = Math.max(1, ...Object.values(e.tools));
  const tools = Object.entries(e.tools).sort((a, b) => b[1] - a[1]);
  const projs = [...e.byProj].sort((a, b) => b[1].calls - a[1].calls);

    <h3>Recent sessions (${sess.length})</h3>

// one session: its numbers, its subagents and what it called
function openSession(id) {
  const t = sessionIndex.get(id);
  if (!t) return;
  if (DATA.live) return openFlow(t);
  const family = DATA.rows.filter((r) => rootOf(r).id === id);
  const subs = family.filter((r) => r.parent);
  const sum = (f) => family.reduce((n, r) => n + f(r), 0);
  const tok = family.reduce((a, r) => { for (const k in r.tokens) a[k] = (a[k] || 0) + r.tokens[k]; return a; }, {});
  const merge = (pick) => { const m = {}; for (const r of family) for (const [k, v] of Object.entries(pick(r.usage || {}))) m[k] = (m[k] || 0) + v; return m; };
  const mcp = {};
  for (const r of family) for (const [k, v] of Object.entries(r.usage?.mcp || {})) { const e = (mcp[k] ||= { calls: 0, errors: 0, tools: {} }); e.calls += v.calls; e.errors += v.errors; for (const [n, c] of Object.entries(v.tools)) e.tools[n] = (e.tools[n] || 0) + c; }
  const chips = (obj, label) => { const e = Object.entries(obj).sort((a, b) => b[1] - a[1]); return `<h4>${label}</h4>` + (e.length ? `<div class="chips">${e.map(([k, n]) => `<span class="tag">${esc(k)} · ${n}</span>`).join('')}</div>` : '<p class="note">None.</p>'); };
  const est = family.some((r) => r.costEstimated);
  $('#dlgBody').innerHTML = `
    <div class="dhead"><div style="flex:1"><h3>${esc(t.title || t.id)}</h3>
      <div class="meta"><span>${esc(clientOf(t))}</span><span>${esc(t.model || '')}</span><span>${new Date(t.start).toLocaleString()}</span><span>${esc(t.outcome)}</span><span title="${esc(t.directory)}">${esc(t.directory)}</span></div></div>
      <button class="close" type="button" id="dlgClose">Close</button></div>
    <div class="dbody">
      <div class="kpis" style="margin-bottom:0">
        <div class="kpi"><b>${fmtTok(tokAll(tok))}</b><span>tokens (${fmtTok(tok.cacheRead || 0)} cache reads)</span></div>
        <div class="kpi"><b>${est ? '≈' : ''}${fmtCost(sum((r) => r.cost))}</b><span>cost${subs.length ? ' with subagents' : ''}</span></div>
        <div class="kpi"><b>${fmtMs(sum((r) => r.activeMs))}</b><span>agent active time</span></div>
        <div class="kpi"><b>${subs.length}</b><span>subagent sessions</span></div>
      </div>
      ${chips(merge((u) => u.skills || {}), 'Skills')}
      ${chips(merge((u) => u.agents || {}), 'Subagent types')}
      <h4>MCP servers</h4>${Object.keys(mcp).length ? `<div class="tablewrap"><table><thead><tr><th>Server</th><th class="num">Calls</th><th class="num">Errors</th><th>Tools</th></tr></thead><tbody>${Object.entries(mcp).map(([k, e]) => `<tr><td>${esc(k)}</td><td class="num">${e.calls}</td><td class="num">${e.errors || ''}</td><td class="dim" style="white-space:normal">${Object.entries(e.tools).sort((a, b) => b[1] - a[1]).map(([n, c]) => esc(n) + ' · ' + c).join(', ')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">None.</p>'}
      ${chips(merge((u) => u.tools || {}), 'Built-in tools by kind')}
      ${subs.length ? `<h4>Subagent sessions</h4><div class="tablewrap"><table><thead><tr><th>Agent</th><th>Task</th><th>Model</th><th class="num">Active</th><th class="num">Tokens</th><th class="num">Cost</th></tr></thead><tbody>${subs.sort((a, b) => a.start - b.start).map((r) => `<tr><td>${esc(r.agent || 'subagent')}</td><td class="title" title="${esc(r.title)}">${esc(r.title)}</td><td class="dim">${esc(r.model || '')}</td><td class="num">${fmtMs(r.activeMs)}</td><td class="num">${fmtTok(tokAll(r.tokens))}</td><td class="num">${r.costEstimated ? '≈' : ''}${fmtCost(r.cost)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      <p class="note">The session's flow, timeline and prompts need the served page: run <code>skillmap --global</code> without <code>-o</code>.</p>
    </div>`;
  const dlg = $('#dlg');
  $('#dlgClose').onclick = () => dlg.close();
  dlg.showModal();
}

// served: a session opens its project's report, at the session's page (flow, skills, subagents, MCP, timeline)
function openPanel({ title, src, rowKey, loadingText }) {
  const frame = $('#flowFrame'), dlg = $('#flow');
  // the report follows the page's theme
  src = src.includes('#') ? src.replace('#', `&theme=${effTheme()}#`) : `${src}&theme=${effTheme()}`;
  const mark = () => document.querySelectorAll('tr.sel').forEach((r) => r.classList.remove('sel'));
  mark();
  if (rowKey) document.querySelector(`tr[data-key="${CSS.escape(rowKey)}"]`)?.classList.add('sel');
  $('#flowTitle').textContent = title;
  $('#flowOpen').href = src.replace('&embed=session', '');
  const load = () => {
    $('#flowLoad').hidden = false;
    $('#flowLoad').innerHTML = `<span class="spin" aria-hidden="true"></span>${esc(loadingText)}`;
    frame.style.visibility = 'hidden';
    frame.src = src;
  };
  frame.onload = () => { if (frame.src === 'about:blank') return; $('#flowLoad').hidden = true; frame.style.visibility = 'visible'; };
  $('#flowReload').onclick = load;
  $('#flowBack').onclick = () => dlg.close();
  dlg.onclose = () => { frame.src = 'about:blank'; mark(); };
  load();
  dlg.showModal();
  dlg.focus(); // not on the first button: no focus ring in the header
}

const PROJ_PAGE_NOTE = 'Skills and agents are what the folder defines (SKILL.md, agents, instruction files); the rest comes from the sessions on screen.';
function drawProjects(rows, top) {
  const nDays = 14, today = dayStart(Date.now());
  const by = new Map();
  for (const r of rows) {
    const root = rootOf(r), key = root.directory || '(unknown)';
    const p = by.get(key) || { dir: key, sessions: 0, tokens: 0, cost: 0, last: 0, est: false, clients: new Set(), perDay: new Array(nDays).fill(0) };
    p.tokens += tokAll(r.tokens);
    p.cost += r.cost;
    p.est ||= r.costEstimated;
    if (!r.parent) {
      p.sessions++;
      p.last = Math.max(p.last, r.start);
      p.clients.add(clientOf(r));
      const i = nDays - 1 - Math.round((today - dayStart(r.start)) / 86400000);
      if (i >= 0) p.perDay[i]++;
    }
    by.set(key, p);
  }
  const SORT = { last: (a, b) => b.last - a.last, cost: (a, b) => b.cost - a.cost, tokens: (a, b) => b.tokens - a.tokens, sessions: (a, b) => b.sessions - a.sessions };
  const list = [...by.values()].filter((p) => p.sessions).sort(SORT[st.psort]);
  const th = (key, label, cls = '') => `<th class="${cls}"><button type="button" data-psort="${key}">${label}${st.psort === key ? ' ↓' : ''}</button></th>`;
  const when = (t) => new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const el = $('#projectsTable');
  el.innerHTML = `<table class="rich tiles">
    <thead><tr><th>Project</th>${th('sessions', 'Sessions', 'num')}${th('tokens', 'Tokens', 'num')}${th('cost', 'Cost', 'num')}<th class="num" title="Defined in the folder">Skills</th><th class="num" title="Defined in the folder">Agents</th>${th('last', 'Last activity')}</tr></thead>
    <tbody>${list.slice(0, st.plimit).map((p) => {
      const info = (DATA.projects || {})[p.dir];
      return `<tr data-key="${esc(p.dir)}" data-dir="${esc(p.dir)}" tabindex="0" role="button" aria-label="Open project ${esc(projectOf({ directory: p.dir }))}">
        <td><div class="skill">${avatar(p.dir).replace('margin-right:8px', '')}<div><div class="nm">${esc(projectOf({ directory: p.dir }))}${[...p.clients].map((c) => `<span class="tag">${esc(c)}</span>`).join('')}</div><div class="ds" title="${esc(p.dir)}">${esc(p.dir)}</div></div></div></td>
        <td class="num"><span class="cell">${p.sessions}${spark(p.perDay, true)}</span></td>
        <td class="num">${fmtTok(p.tokens)}</td>
        <td class="num">${p.est ? '≈' : ''}${fmtCost(p.cost)}</td>
        <td class="num">${info ? info.skills : '–'}</td>
        <td class="num">${info ? info.agents : '–'}</td>
        <td class="dim" style="white-space:nowrap">${when(p.last)}</td></tr>`;
    }).join('')}</tbody></table>
    ${list.length > st.plimit ? `<button type="button" class="fullbtn" id="moreProj">Show more (${list.length - st.plimit} left) ›</button>` : ''}
    <p class="note">${PROJ_PAGE_NOTE} “–” = the folder is gone, or it is your home folder (not scanned). Bars: sessions per day, last ${nDays} days.</p>`;
  const open = (tr) => { if (!tr) return; if (DATA.live) openProject(tr.dataset.dir); else el.querySelector('.note').insertAdjacentHTML('beforebegin', '<p class="note" role="status">The project report needs the served page: run <code>skillmap --global</code> without <code>-o</code>.</p>'); };
  el.onclick = (e) => {
    const b = e.target.closest('button');
    if (b?.dataset.psort) { st.psort = b.dataset.psort; render(); return; }
    if (b?.id === 'moreProj') { st.plimit += 25; render(); return; }
    open(e.target.closest('tr[data-dir]'));
  };
  el.onkeydown = (e) => { const tr = e.target.closest('tr[data-dir]'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(tr); } };
}

function drawChart(days, byDay, order, color, max, M, grain) {
  const svg = $('#chart');
  const W = Math.max(600, svg.parentElement.clientWidth - 2), H = 280;
  const L = 54, R = 8, T = 10, B = 26;
  const iw = W - L - R, ih = H - T - B;
  const bw = iw / days.length;
  const gap = Math.min(3, bw * 0.2);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let out = '';
  for (let i = 0; i <= 4; i++) {
    const y = T + ih - (ih * i) / 4;
    out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${M.fmt((max * i) / 4)}</text>`;
  }
  const every = Math.ceil(days.length / Math.floor(iw / 56));
  days.forEach((d, i) => {
    const x = L + i * bw;
    if (i % every === 0) out += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${grain.label(d)}</text>`;
    let y = T + ih;
    const parts = byDay.get(d) || new Map();
    for (const k of order) {
      const v = parts.get(k);
      if (!v) continue;
      const h = (v / max) * ih;
      y -= h;
      out += `<rect class="bar" x="${x + gap / 2}" y="${y}" width="${Math.max(1, bw - gap)}" height="${Math.max(0.5, h)}" fill="${k === 'Other' ? css('--other') : color(k)}" data-d="${d}" data-k="${esc(k)}"/>`;
    }
  });
  svg.innerHTML = out;
  svg.onmousemove = (e) => {
    const r = e.target.closest('rect.bar');
    const tip = $('#tip');
    if (!r) { tip.style.display = 'none'; return; }
    const d = Number(r.dataset.d), parts = byDay.get(d);
    const total = [...parts.values()].reduce((a, b) => a + b, 0);
    tip.innerHTML = `<b>${grain.full(d)} · ${M.fmt(total)}</b>` + order.filter((k) => parts.get(k)).map((k) => `<div class="r"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:${k === 'Other' ? css('--other') : color(k)}"></i>${esc(k)}</span><span>${M.fmt(parts.get(k))}</span></div>`).join('');
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 320) + 'px';
    tip.style.top = e.clientY + 14 + 'px';
  };
  svg.onmouseleave = () => { $('#tip').style.display = 'none'; };
}

// served page: pick up new and running sessions while it stays open
if (DATA.live) {
  const POLL_MS = 5000;
  const poll = async () => {
    if (document.hidden) return;
    try {
      const res = await fetch('data', { cache: 'no-store' });
      if (!res.ok) return;
      const next = await res.json();
      // keep the side panel and the page's position: only redraw when something moved
      if (JSON.stringify(next.rows.map((r) => [r.id, r.end, r.outcome])) === JSON.stringify(DATA.rows.map((r) => [r.id, r.end, r.outcome]))) return;
      Object.assign(DATA, next, { live: true });
      sessionIndex = new Map(DATA.rows.map((r) => [r.id, r]));
      render();
    } catch { /* server gone or offline: try again next tick */ }
  };
  setInterval(poll, POLL_MS);
  document.addEventListener('visibilitychange', poll);
}

addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 120); });
render();
// a link to one project: <page>#project=<folder>
const deepProject = /^#project=(.+)$/.exec(location.hash)?.[1];
if (deepProject && DATA.live && decodeURIComponent(deepProject) in (DATA.projects || {})) { st.view = 'projects'; render(); openProject(decodeURIComponent(deepProject)); }
// a link to one session: <page>#session=<id>
const deepLink = /^#session=(.+)$/.exec(location.hash)?.[1];
if (deepLink && sessionIndex.has(decodeURIComponent(deepLink))) { st.view = 'sessions'; render(); openSession(decodeURIComponent(deepLink)); } // the list stays behind the panel
</script>
</body>
</html>
